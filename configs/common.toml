[experiment]
name = "pilot-b1"
method = "b1"
seed = 42

[model]
base_model = "Qwen/Qwen3-1.7B"
revision = "UNSET_PIN_MODEL_REVISION"
sft_checkpoint = "artifacts/shared-sft-1.7b"
sft_sha256 = "UNSET_HASH_CHECKPOINT"
enable_thinking = false

[data]
train_parquet = "data/train.parquet"
val_parquet = "data/val.parquet"
manifest_path = "data/manifest.json"
manifest_sha256 = "UNSET_HASH_MANIFEST"
candidate_count = 30
max_prompt_tokens = 4096
max_response_tokens = 256
retriever = "BAAI/bge-base-en-v1.5"
corpus = "UNSET_WIKIPEDIA_2018_12_SNAPSHOT"

[training]
learning_rate = 0.000001
query_batch_size = 4
mini_batch_size = 4
group_size = 4
temperature = 0.7
top_p = 0.8
top_k = 20
clip_ratio = 0.2
kl_coefficient = 0.001
warmup_steps = 10
epochs = 1
max_steps = 50
eval_every = 5
save_every = 25

[reward]
backend = "openai_compatible"
scale = 1.0
parser_policy = "rr_compatible"
judge_failure_policy = "abort"

[judge]
model = "UNSET_PIN_JUDGE_MODEL"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
cache_path = "artifacts/judge-cache.sqlite"
max_attempts = 4
timeout_seconds = 60
workers = 4

[ato]
grpo_weight = 0.7
thresholds = [0.3, 0.6]
max_teacher_prompt_tokens = 6144
reflection_tokens = 256

[runtime]
backend_commit = "7df929c42482dccd0181b29a22983356762a7b92"
output_dir = "runs/pilot-b1"
nodes = 1
gpus_per_node = 1
tensor_parallel_size = 1
micro_batch_size = 1
rollout_memory_fraction = 0.3
param_offload = true
optimizer_offload = true
