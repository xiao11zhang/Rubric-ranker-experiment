[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setwise-baselines"
version = "0.1.0"
description = "Controlled RR-SFT / GRPO / ATO experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=16"]
metrics = ["tensorboard>=2.16"]
test = ["torch>=2.4"]

[project.scripts]
setwise = "setwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
setwise = ["prompts/*.yaml", "_upstream/manifest.json", "_upstream/rr/*", "_upstream/ato/*"]
